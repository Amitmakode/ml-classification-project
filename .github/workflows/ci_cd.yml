# This file defines GitHub Actions CI/CD pipeline

name: CI/CD Pipeline  # pipeline name

on:
  push:
    branches: [main]  # trigger on push to main branch
  pull_request:
    branches: [main]  # trigger on pull request to main branch

jobs:
  test:
    name: Run Tests  # job name
    runs-on: ubuntu-latest  # run on ubuntu

    steps:
      - name: Checkout code  # clone repo
        uses: actions/checkout@v3

      - name: Set up Python  # setup python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies  # install requirements
        run: pip install -r requirements.txt

      - name: Run pytest  # run all tests
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MLFLOW_TRACKING_URI: ./mlruns
          MODEL_PATH: ./ml/model.pkl
        run: pytest tests/test_api.py -v

  build-and-push:
    name: Build and Push Docker Image  # job name
    runs-on: ubuntu-latest  # run on ubuntu
    needs: test  # run only if test job passes

    steps:
      - name: Checkout code  # clone repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub  # login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image  # build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shoppers-ml:latest